# One entry per actively maintained mirror; the homepage table renders this list
# in order. Fields: name (display), url (mirror root), cadence (refresh schedule),
# repo (sync pipeline), healthcheck (public healthchecks.io badge for the sync),
# upstream {name, url}.

[[mirrors]]
name = "CTAN"
url = "https://ctan.ijosh.com/"
cadence = "hourly"
repo = "https://github.com/jshvn/ctan"
healthcheck = "https://healthchecks.io/b/2/f4ad55cc-4b2d-4cce-b133-aba5381d9e71.svg"
upstream = { name = "ctan.org", url = "https://ctan.org" }

[[mirrors]]
name = "TeX Live (tlnet)"
url = "https://tlnet.ijosh.com/"
cadence = "daily"
repo = "https://github.com/jshvn/tlnet"
healthcheck = "https://healthchecks.io/b/2/f34567b9-d513-41a5-93d8-56fb69d25257.svg"
upstream = { name = "ctan.org", url = "https://ctan.org/tex-archive/systems/texlive/tlnet" }
