# One entry per actively maintained mirror; the homepage tiles render this list
# in order. Fields: name (display), url (mirror root), cadence (refresh schedule),
# repo (sync pipeline), healthcheck (public healthchecks.io badge for the sync),
# upstream {name, url, icon}, and usage -- one sentence describing the mirror, which
# reaches the page only as its description in the ItemList JSON-LD.
#
# upstream.icon names an icon file in assets/icons/ or the theme's (without .svg):
# Font Awesome Free, or ctan (drawn by brand/render_ctan_icon.py). The build fails
# if it is missing.
#
# healthcheck must be the single-check two-state badge URL (/b/2/<uuid>.svg).
# The page maps any status other than "down" to a green check, so a three-state
# or project-wide badge here would render a stalled sync as healthy.

[[mirrors]]
name = "CTAN"
url = "https://ctan.katoptra.org/"
cadence = "hourly"
repo = "https://github.com/katoptra/ctan"
healthcheck = "https://healthchecks.io/b/2/f4ad55cc-4b2d-4cce-b133-aba5381d9e71.svg"
upstream = { name = "ctan.org", url = "https://ctan.org", icon = "ctan" }
usage = "Every CTAN path is served at the root, so the host drops in anywhere a CTAN mirror URL is accepted. TeX Live and TinyTeX both reach it through tlmgr."

[[mirrors]]
name = "TeX Live (tlnet)"
url = "https://tlnet.katoptra.org/"
cadence = "daily"
repo = "https://github.com/katoptra/tlnet"
healthcheck = "https://healthchecks.io/b/2/f34567b9-d513-41a5-93d8-56fb69d25257.svg"
upstream = { name = "ctan.org", url = "https://ctan.org/tex-archive/systems/texlive/tlnet", icon = "ctan" }
usage = "The tlnet subtree alone — the directory tlmgr installs and updates from — with every platform, doc and source. It tracks the current TeX Live release and moves to the next when upstream does."

[[mirrors]]
name = "GNU"
url = "https://gnu.katoptra.org/"
cadence = "twice daily"
repo = "https://github.com/katoptra/gnu"
healthcheck = "https://healthchecks.io/b/2/5b1c7694-c3aa-4db7-9813-0b898669564d.svg"
upstream = { name = "gnu.org", url = "https://ftp.gnu.org/gnu/", icon = "gnu" }
usage = "Every path of ftp.gnu.org/gnu at the root — the release tarballs and .sig signatures of over 300 GNU packages, from GCC, glibc and Binutils to Emacs, Bash, Coreutils and Guix, with the GNU keyring to verify them — so the host drops in anywhere an ftp.gnu.org or ftpmirror.gnu.org URL is accepted. Alpha releases (alpha.gnu.org) are not included."

[[mirrors]]
name = "Savannah (nongnu)"
url = "https://nongnu.katoptra.org/"
cadence = "twice daily"
repo = "https://github.com/katoptra/nongnu"
healthcheck = "https://healthchecks.io/b/2/1690a027-fc78-4459-a66b-c0d3d5078980.svg"
upstream = { name = "savannah.nongnu.org", url = "https://download.savannah.nongnu.org/releases/", icon = "gnu" }
usage = "Every path of download.savannah.nongnu.org/releases at the root — the release files of over 1,000 free software projects that Savannah hosts outside GNU, among them FreeType, acl and attr, dmidecode, lzip, nmh, quilt and TinyCC — so a Savannah download URL works with only the host swapped."

# Private mirrors copy the owner's own accounts, so they have no url: the tile shows
# the name as plain text and "Into <into>" where a public mirror shows its host, and
# they stay out of the JSON-LD and llms.txt's list of mirrors to use. The fields are
# the ones above, less url and usage, plus into (where the copy lands).

[[private]]
name = "Dropbox"
cadence = "nightly"
into = "Proton Drive"
repo = "https://github.com/katoptra/dropbox"
healthcheck = "https://healthchecks.io/b/2/7ab971f5-d3bc-4bfe-9a63-72103114ae28.svg"
upstream = { name = "dropbox.com", url = "https://www.dropbox.com", icon = "dropbox" }

[[private]]
name = "GitHub"
cadence = "nightly"
into = "Proton Drive"
repo = "https://github.com/katoptra/github"
healthcheck = "https://healthchecks.io/b/2/875451ff-376b-4fb7-b7c1-40278e873faf.svg"
upstream = { name = "github.com", url = "https://github.com", icon = "github" }
