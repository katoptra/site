# One entry for each mirror in operation. The homepage tiles show the entries in this
# sequence. The fields are:
#   name         the display name
#   url          the root of the mirror
#   cadence      the refresh schedule
#   repo         the sync pipeline
#   healthcheck  the public healthchecks.io badge for the sync
#   upstream     {name, url, icon}
#   usage        a short description of the mirror. The page uses it only as the
#                description of the mirror in the ItemList JSON-LD.
#
# upstream.icon is the name of an icon file in assets/icons/ or in the icons of the theme,
# without .svg. The icon is from Font Awesome Free, or it is ctan
# (brand/render_ctan_icon.py makes it) or gnu (brand/render_gnu_icon.py makes it). If the
# file is missing, the build stops with an error.
#
# healthcheck must be the URL of the two-state badge for one check (/b/2/<uuid>.svg).
# The page shows a green check for each status that is not "down". Thus, with a
# three-state badge or a project badge, the page can show a green check for a sync that
# stopped.

[[mirrors]]
name = "CTAN"
url = "https://ctan.katoptra.org/"
cadence = "hourly"
repo = "https://github.com/katoptra/ctan"
healthcheck = "https://healthchecks.io/b/2/f4ad55cc-4b2d-4cce-b133-aba5381d9e71.svg"
upstream = { name = "ctan.org", url = "https://ctan.org", icon = "ctan" }
usage = "The mirror serves all the paths of CTAN at its root. Thus, its URL can replace a CTAN mirror URL. TeX Live and TinyTeX use it with tlmgr."

[[mirrors]]
name = "TeX Live (tlnet)"
url = "https://tlnet.katoptra.org/"
cadence = "daily"
repo = "https://github.com/katoptra/tlnet"
healthcheck = "https://healthchecks.io/b/2/f34567b9-d513-41a5-93d8-56fb69d25257.svg"
upstream = { name = "ctan.org", url = "https://ctan.org/tex-archive/systems/texlive/tlnet", icon = "ctan" }
usage = "The mirror serves only the tlnet subtree: the directory that tlmgr installs and updates from. It has all the platforms, docs and sources. It has the TeX Live release that upstream has, and it moves to the next release when upstream moves."

[[mirrors]]
name = "GNU"
url = "https://gnu.katoptra.org/"
cadence = "twice a day"
repo = "https://github.com/katoptra/gnu"
healthcheck = "https://healthchecks.io/b/2/5b1c7694-c3aa-4db7-9813-0b898669564d.svg"
upstream = { name = "gnu.org", url = "https://ftp.gnu.org/gnu/", icon = "gnu" }
usage = "The mirror serves all the paths of ftp.gnu.org/gnu at its root. These are the release tarballs and .sig signatures of more than 300 GNU packages, from GCC, glibc and Binutils to Emacs, Bash, Coreutils and Guix. The GNU keyring to verify them is also at the root. In a URL, gnu.katoptra.org can replace ftp.gnu.org/gnu or ftpmirror.gnu.org. The alpha releases (alpha.gnu.org) are on gnu-alpha.katoptra.org."

[[mirrors]]
name = "GNU alpha"
url = "https://gnu-alpha.katoptra.org/"
cadence = "twice a day"
repo = "https://github.com/katoptra/gnu-alpha"
healthcheck = "https://healthchecks.io/b/2/755c0183-53ad-43d5-8f9d-061594bc23e4.svg"
upstream = { name = "alpha.gnu.org", url = "https://alpha.gnu.org/gnu/", icon = "gnu" }
usage = "The mirror serves all the paths of alpha.gnu.org/gnu at its root. These are the alpha and beta releases of GNU packages and their .sig signatures, for example the pretests of Emacs, Automake and Gettext, and the release candidates of Guix. The GNU keyring to verify them is at the root of gnu.katoptra.org. In a URL, gnu-alpha.katoptra.org can replace alpha.gnu.org/gnu."

[[mirrors]]
name = "Savannah (nongnu)"
url = "https://nongnu.katoptra.org/"
cadence = "twice a day"
repo = "https://github.com/katoptra/nongnu"
healthcheck = "https://healthchecks.io/b/2/1690a027-fc78-4459-a66b-c0d3d5078980.svg"
upstream = { name = "savannah.nongnu.org", url = "https://download.savannah.nongnu.org/releases/", icon = "gnu" }
usage = "The mirror serves all the paths of download.savannah.nongnu.org/releases at its root. These are the release files of more than 1,000 free software projects that Savannah hosts and that are not part of GNU. Examples are FreeType, acl and attr, dmidecode, lzip, nmh, quilt and TinyCC. In a Savannah download URL, nongnu.katoptra.org can replace download.savannah.nongnu.org/releases."

# Private mirrors copy the owner's accounts. Thus, they have no url. The tile shows the
# name as text without a link, and it shows "Into <into>" where a public mirror shows
# its host. Private mirrors stay out of the JSON-LD, and out of the list of mirrors to
# use in llms.txt. Their fields are the fields of a public mirror, without url and
# usage, and with into (where the copy goes).

[[private]]
name = "Dropbox"
cadence = "nightly"
into = "Proton Drive"
repo = "https://github.com/katoptra/dropbox"
healthcheck = "https://healthchecks.io/b/2/7ab971f5-d3bc-4bfe-9a63-72103114ae28.svg"
upstream = { name = "dropbox.com", url = "https://www.dropbox.com", icon = "dropbox" }

[[private]]
name = "GitHub"
cadence = "daily"
into = "Proton Drive"
repo = "https://github.com/katoptra/github"
healthcheck = "https://healthchecks.io/b/2/875451ff-376b-4fb7-b7c1-40278e873faf.svg"
upstream = { name = "github.com", url = "https://github.com", icon = "github" }
