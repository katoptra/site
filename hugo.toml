# Site settings
baseURL = "https://katoptra.org/"
locale = "en-US"
title = "Verified Open-Source Software Mirrors - katoptra.org"
theme = "ijosh"
disableKinds = ["section", "taxonomy", "RSS"]

# Copyright
copyright = "&copy;2026 Josh Vaughen"

[sitemap]
  changeFreq = 'monthly'
  disable = false
  filename = 'sitemap.xml'
  priority = 0.8

[params]

  # Metadata for search engines and social sharing. %s in the description is the public
  # mirrors' names, filled from data/mirrors.toml by layouts/partials/head.html.
  author = "Josh Vaughen"
  description = "Verified mirrors of %s. Open pipelines sync them on a schedule, and Cloudflare's global network serves them."

  # Cloudflare Web Analytics beacon token (public; omit to disable the beacon)
  # cloudflareBeaconToken = ""
