# Site configuration
baseURL = "https://katoptra.org/"
locale = "en-US"
title = "Verified Open-Source Software Mirrors - katoptra.org"
theme = "katoptra"
disableKinds = ["section", "taxonomy", "RSS"]

# Copyright
copyright = "&copy;2026 Josh Vaughen"

[sitemap]
  changeFreq = 'monthly'
  disable = false
  filename = 'sitemap.xml'
  priority = 0.8

[params]

  # Metadata for search engines and for link previews. The names of the public mirrors go
  # into the %s in the description. layouts/partials/head.html puts them there from
  # data/mirrors.toml.
  author = "Josh Vaughen"
  description = "Verified mirrors of %s. Open pipelines sync them on a schedule, and Cloudflare's global network serves them."

  # The token of the Cloudflare Web Analytics beacon. The token is public. If you do not
  # set it, the page does not load the beacon.
  # cloudflareBeaconToken = ""

  # The CSS of this site, after the tokens and the base of the theme in the bundle.
  css = ["css/mirrors.css"]
