# mirrors: the landing page for katoptra.org. It is a Hugo site, and Cloudflare Pages
# deploys it at each push to main. themes/katoptra is the shell of a katoptra page, and the
# site root has the mirror index.

version: "3"

vars:
  GIT_DIR:
    sh: pwd

tasks:
  default:
    desc: Print the menu
    silent: true
    # ponytail: we keep this listing manually, because go-task cannot show tasks in groups
    # or with notes. Thus, each new task must have a line in the listing. `task --list`
    # stays the view that go-task makes.
    cmds:
      - |
        b=$(printf '\033[1m'); c=$(printf '\033[1;36m'); d=$(printf '\033[2m'); r=$(printf '\033[0m')
        printf '%s\n' \
          "" \
          "${b}mirrors${r}   ${d}landing page for the mirrors run at katoptra.org${r}" \
          "" \
          "${c}build -- offline, changes nothing live${r}" \
          "  task serve                Build and serve with drafts + watch" \
          "  task build                Production build, matches Cloudflare Pages" \
          "                            ${d}deploys happen on push to main, not from here${r}" \
          "" \
          "${c}checks -- offline, no credentials needed${r}" \
          "  task check                Build, fail if any data/mirrors.toml link is missing from the page, run the JS self-check," \
          "                            ${d}and fail if the brand files differ from a rebuild${r}" \
          "" \
          "${c}brand -- the mark, favicons, social card and tokens, from brand/build.py${r}" \
          "  task brand                Rebuild every brand file under themes/katoptra/" \
          "  task brand:fonts          Re-fetch Gabarito from google/fonts and re-subset it (network)" \
          "" \
          "${c}clean${r}" \
          "  task clean                Remove generated and auxiliary files" \
          ""

  serve:
    desc: Build and serve hugo content
    aliases: [server, serv]
    cmds:
      - hugo server -D -w

  build:
    desc: Production build (minified, garbage-collected) — matches Cloudflare Pages
    cmds:
      - hugo --minify --gc

  check:
    desc: Build, verify every URL in data/mirrors.toml renders into the page, check the social card, run the JS self-check, check the brand files
    cmds:
      - uv run brand/build.py --check
      - hugo --minify --gc
      - node assets/js/status.check.mjs
      - |
        fail=0
        for url in $(grep -Eo 'https://[^"]+' data/mirrors.toml); do
          grep -qF "$url" public/index.html || { echo "MISSING $url"; fail=1; }
        done
        [ "$fail" -eq 0 ] && echo "check: all mirror links present in public/index.html"
        # The unfurl card has two halves: a file that brand/build.py makes, and the tags in
        # the page. One half without the other gives a broken preview. Thus, the check
        # asserts the two halves.
        for tag in 'og:image' 'twitter:card' 'og:image:width'; do
          grep -qF "$tag" public/index.html || { echo "MISSING meta $tag"; fail=1; }
        done
        if [ -s public/images/og.png ]; then
          echo "check: social card present ($(wc -c < public/images/og.png | tr -d ' ') bytes)"
        else
          echo "MISSING public/images/og.png -- run task brand"; fail=1
        fi
        # RFC 9116 tells a client not to use security.txt after its Expires date. Thus,
        # an expired date in Expires causes a failure.
        sec=public/.well-known/security.txt
        exp=$(sed -n 's/^Expires: //p' "$sec")
        [[ "$exp" > "$(date -u +%Y-%m-%dT%H:%M:%S)" ]] \
          || { echo "EXPIRED $sec ($exp) -- move Expires forward, under a year out"; fail=1; }
        exit "$fail"
      # The JSON-LD is a template that we write manually in a script block. In that
      # block, Go's contextual escaping can easily make incorrect output. Thus, the
      # check parses the JSON-LD, because it is not sufficient to look at the output.
      - |
        node <<'JS'
        const fs = require("node:fs");
        const html = fs.readFileSync("public/index.html", "utf8");
        const blocks = [...html.matchAll(
          /<script type=["']?application\/ld\+json["']?>([\s\S]*?)<\/script>/g)].map((m) => m[1]);
        if (blocks.length !== 2) {
          console.error(`ld+json: expected 2 blocks (WebSite, ItemList), found ${blocks.length}`);
          process.exit(1);
        }
        const types = blocks.map((b) => {
          let d;
          try {
            d = JSON.parse(b);
          } catch (e) {
            console.error(`ld+json: block does not parse -- ${e.message}`);
            process.exit(1);
          }
          return d["@type"];
        });
        for (const want of ["WebSite", "ItemList"]) {
          if (!types.includes(want)) {
            console.error(`ld+json: no ${want} block`);
            process.exit(1);
          }
        }
        console.log(`check: JSON-LD parses (${types.join(", ")})`);
        JS

  brand:
    desc: Rebuild the mark, favicons, social card and tokens from brand/build.py
    cmds:
      - uv run brand/build.py

  brand:fonts:
    desc: Re-fetch Gabarito from google/fonts at the pinned commit and re-subset it into static/fonts
    cmds:
      - uv run brand/fonts.py

  clean:
    desc: Remove generated and auxiliary files
    cmds:
      - rm -rf {{.GIT_DIR}}/public/
      - rm -rf {{.GIT_DIR}}/resources/
      - rm -f {{.GIT_DIR}}/.hugo_build* {{.GIT_DIR}}/hugo_stats.json
