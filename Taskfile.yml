# mirrors — the landing page for katoptra.org, a Hugo site deployed by
# Cloudflare Pages on push to master. The design system is not local: layouts,
# tokens, and fonts are vendored from the ijosh.com repo into themes/ijosh by
# `task theme:update` (pinned by themes/ijosh/THEME_COMMIT); this repo only
# overrides what a mirrors index needs.

version: "3"

vars:
  GIT_DIR:
    sh: pwd
  THEME_REPO: https://github.com/jshvn/ijosh.com

tasks:
  default:
    desc: Print the menu
    silent: true
    # ponytail: hand-maintained listing -- go-task can neither group nor annotate,
    # so a new task means a line below. `task --list` stays the generated view.
    cmds:
      - |
        b=$(printf '\033[1m'); c=$(printf '\033[1;36m'); d=$(printf '\033[2m'); r=$(printf '\033[0m')
        printf '%s\n' \
          "" \
          "${b}mirrors${r}   ${d}landing page for the mirrors run at katoptra.org${r}" \
          "" \
          "${c}build -- offline, changes nothing live${r}" \
          "  task serve                Build and serve with drafts + watch" \
          "  task build                Production build, matches Cloudflare Pages" \
          "                            ${d}deploys happen on push to master, not from here${r}" \
          "" \
          "${c}checks -- offline, no credentials needed${r}" \
          "  task check                Build, fail if any data/mirrors.toml link is missing from the page, run the JS self-check" \
          "" \
          "${c}theme -- the design system lives in the ijosh.com repo${r}" \
          "  task theme:update         Re-vendor ijosh.com master into themes/ijosh" \
          "                            ${d}pins the commit in themes/ijosh/THEME_COMMIT; eyeball the page after${r}" \
          "" \
          "${c}clean${r}" \
          "  task clean                Remove generated and auxiliary files" \
          ""

  serve:
    desc: Build and serve hugo content
    aliases: [server, serv]
    cmds:
      - hugo server -D -w

  build:
    desc: Production build (minified, garbage-collected) — matches Cloudflare Pages
    cmds:
      - hugo --minify --gc

  check:
    desc: Build, verify every URL in data/mirrors.toml renders into the page, check the social card, run the JS self-check
    cmds:
      - hugo --minify --gc
      - node assets/js/status.check.mjs
      - |
        fail=0
        for url in $(grep -Eo 'https://[^"]+' data/mirrors.toml); do
          grep -qF "$url" public/index.html || { echo "MISSING $url"; fail=1; }
        done
        [ "$fail" -eq 0 ] && echo "check: all mirror links present in public/index.html"
        # The unfurl card is a generated file plus its tags -- either half alone
        # ships a broken preview, so assert both.
        for tag in 'og:image' 'twitter:card' 'og:image:width'; do
          grep -qF "$tag" public/index.html || { echo "MISSING meta $tag"; fail=1; }
        done
        if [ -s public/images/og.png ]; then
          echo "check: social card present ($(wc -c < public/images/og.png | tr -d ' ') bytes)"
        else
          echo "MISSING public/images/og.png -- run brand/render_og_image.py"; fail=1
        fi
        exit "$fail"
      # The JSON-LD is hand-templated inside a script block, where Go's
      # contextual escaping is easy to fight and lose to; parse it rather than
      # eyeball it.
      - |
        node <<'JS'
        const fs = require("node:fs");
        const html = fs.readFileSync("public/index.html", "utf8");
        const blocks = [...html.matchAll(
          /<script type=["']?application\/ld\+json["']?>([\s\S]*?)<\/script>/g)].map((m) => m[1]);
        if (blocks.length !== 2) {
          console.error(`ld+json: expected 2 blocks (WebSite, ItemList), found ${blocks.length}`);
          process.exit(1);
        }
        const types = blocks.map((b) => {
          let d;
          try {
            d = JSON.parse(b);
          } catch (e) {
            console.error(`ld+json: block does not parse -- ${e.message}`);
            process.exit(1);
          }
          return d["@type"];
        });
        for (const want of ["WebSite", "ItemList"]) {
          if (!types.includes(want)) {
            console.error(`ld+json: no ${want} block`);
            process.exit(1);
          }
        }
        console.log(`check: JSON-LD parses (${types.join(", ")})`);
        JS

  theme:update:
    desc: Re-vendor the ijosh design system (layouts/assets/static) from ijosh.com master
    cmds:
      - |
        tmp=$(mktemp -d)
        git clone --quiet --depth 1 {{.THEME_REPO}} "$tmp"
        rm -rf {{.GIT_DIR}}/themes/ijosh
        mkdir -p {{.GIT_DIR}}/themes/ijosh
        cp -R "$tmp"/layouts "$tmp"/assets "$tmp"/static {{.GIT_DIR}}/themes/ijosh/
        git -C "$tmp" rev-parse HEAD > {{.GIT_DIR}}/themes/ijosh/THEME_COMMIT
        rm -rf "$tmp"
        echo "themes/ijosh now at $(cat {{.GIT_DIR}}/themes/ijosh/THEME_COMMIT)"
        echo "-- local shadows vs the theme's copies (re-apply theme changes by hand) --"
        for f in _headers llms.txt site.webmanifest robots.txt favicon.svg favicon.ico; do
          [ -f {{.GIT_DIR}}/static/$f ] || continue
          diff -u {{.GIT_DIR}}/themes/ijosh/static/$f {{.GIT_DIR}}/static/$f || true
        done

  clean:
    desc: Remove generated and auxiliary files
    cmds:
      - rm -rf {{.GIT_DIR}}/public/
      - rm -rf {{.GIT_DIR}}/resources/
      - rm -f {{.GIT_DIR}}/.hugo_build* {{.GIT_DIR}}/hugo_stats.json
