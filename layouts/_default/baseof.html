<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale | default "en-us" }}">

<head>
  {{ partial "head" . }}
</head>

<body id="fullsingle" class="page-template-page-fullsingle-split">

  <!-- One centered column. This page does not use the split layout of the theme. -->
  <main class="page-single">
    <!-- Masthead: the mark from brand/build.py, adjacent to the wordmark and the tagline.
         The mark is inline. Thus, its tile and inks get their colors from the theme's
         tokens. -->
    <header class="masthead">
      <svg class="masthead-mark" viewBox="0 0 100 100" aria-hidden="true">
        <rect width="100" height="100" rx="22"/>
        <path class="mark-line" d="M50 24L50 76" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round"/>
        <path class="mark-ink" d="M22 30L41 50L22 70" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
        <path class="mark-ink2" d="M78 30L59 50L78 70" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1 class="masthead-name">Katoptra</h1>
      {{ with .Params.tagline }}<p class="tagline">{{ . | markdownify }}</p>{{ end }}
    </header>

    {{ block "main" .  }}
      {{ partial "bio" . }}
    {{ end }}

    {{ partial "footer" . }}
  </main>

</body>
</html>
