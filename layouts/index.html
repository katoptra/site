{{ define "main" }}
  <!-- Intro copy -->
  {{ partial "bio" . }}

  <!-- Mirror index -->
  <div class="mirror-table-wrap">
    <table class="mirror-table">
      <thead>
        <tr>
          <th scope="col">Mirror</th>
          <th scope="col">Refreshed</th>
          <th scope="col">Repo</th>
          <th scope="col">Status</th>
          <th scope="col">Upstream</th>
        </tr>
      </thead>
      <tbody>
        {{ range hugo.Data.mirrors.mirrors }}
        <tr>
          <td><a class="mirror-name" href="{{ .url }}">{{ .name }}</a></td>
          <td class="mirror-cadence">{{ .cadence }}</td>
          <td><a rel="noopener" target="_blank" href="{{ .repo }}">{{ replace .repo "https://github.com/" "" }}</a></td>
          <td><a rel="noopener" target="_blank" href="{{ .healthcheck }}">healthcheck</a></td>
          <td><a rel="noopener" target="_blank" href="{{ .upstream.url }}">{{ .upstream.name }}</a></td>
        </tr>
        {{ end }}
      </tbody>
    </table>
  </div>
{{ end }}
